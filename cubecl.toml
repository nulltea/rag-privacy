# cubecl-runtime configuration. Loaded automatically by cubecl from the
# nearest `cubecl.toml` walking up from the working dir. Documented in
# `cubecl-runtime/src/config/base.rs::from_current_dir`.

[autotune]
# Cache autotune-picked kernel configs under the WORKSPACE `target/`.
# `cache = "target"` walks up from `current_dir()` to the first
# `Cargo.toml` and appends `target/`; run from the workspace root (the
# canonical bench/test invocation in CLAUDE.md), the first `Cargo.toml`
# IS the workspace manifest, so the cache lands in `<workspace>/target/
# autotune/` and is shared across crates. `target/` is gitignored, so
# this is checkout- and machine-portable (no absolute path committed).
# Caveat: invoking `cargo test` from *inside* a crate dir would resolve
# to that crate's `target/` — always run from the workspace root.
cache = "target"

[autotune.logger]
level = "minimal"

[memory]
# Keep the default — `Enabled` lets cubecl-runtime's MemoryManager reuse
# device buffers across calls when sizes repeat. Shape bucketing makes
# this effective (without bucketing, every M=seq_len value is a unique
# buffer size and the pool gets no hits).
persistent_memory = "enabled"
