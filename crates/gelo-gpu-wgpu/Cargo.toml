[package]
name = "gelo-gpu-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `blas` (BLIS-mt) — default-on since 2026-05-19: 5× faster than
# matrixmultiply at n=2048 prefill, equal/better at smaller shapes with
# threads=1. Pass through to gelo-protocol's blas feature (links AOCL-BLIS
# via blis-src `system`). `cuda` — default-on (2026-06-02, dGPU/Nvidia
# bring-up): this is the Nvidia/RTX-5090 deployment box and CUDA is the
# production backend, so all benches + gates must run CUDA (real tensor
# cores), NOT the Vulkan dev path where cubek's BlackboxAccelerated kernel
# is broken. Requires a CUDA toolkit (nvrtc) + driver.
#
# To run the wgpu/Vulkan engine instead, enable the `vulkan` feature (below):
# `--features vulkan` overrides the default CUDA backend at compile time even
# though `cuda` stays in the default set. A box with no CUDA toolkit also drops
# the cuda dep: `--no-default-features --features blas,vulkan`.
default = ["blas", "cuda"]
blas = ["gelo-protocol/blas"]
# CUDA backend (Nvidia dGPU). Flips the engine's cubecl runtime from
# wgpu/Vulkan to cubecl-cuda at compile time. Default-on on this box (above).
cuda = ["dep:cubecl-cuda", "burn-backend/cubecl-cuda"]
# `vulkan` — override `cuda` with the wgpu/Vulkan engine WITHOUT toggling
# default features. The runtime-alias cfg prefers Vulkan whenever this feature
# is present (`vulkan` wins over `cuda`), so `--features vulkan` selects the
# Vulkan engine for the iGPU dev track / any non-CUDA box. cubecl-wgpu is an
# unconditional dependency, so no extra deps are pulled. NOTE: the blackbox
# (tensor-core) cubek kernel is NaN-broken on Vulkan, so under this feature the
# cubek prefill-kernel default falls back to the portable Unit kernel.
vulkan = []

[dependencies]
anyhow.workspace = true
burn-backend.workspace = true
burn-cubecl.workspace = true
burn-tensor.workspace = true
bytemuck.workspace = true
cubecl.workspace = true
cubecl-common.workspace = true
cubecl-core.workspace = true
cubecl-runtime.workspace = true
cubecl-std.workspace = true
cubecl-wgpu.workspace = true
cubecl-cuda = { workspace = true, optional = true }
cubek-attention.workspace = true
gelo-protocol = { path = "../gelo-protocol", default-features = false }
half.workspace = true
ndarray.workspace = true
wgpu.workspace = true

[dev-dependencies]
# `reference-engine` opts into the test-only CPU adapter used by the
# CPU↔Wgpu parity oracle in `tests/parity.rs` and the overhead
# benches. Scoped to dev-deps so the library build (which sets
# `default-features = false` above) stays free of the test adapter.
gelo-protocol = { path = "../gelo-protocol", default-features = false, features = ["reference-engine"] }
env_logger = "0.11"
log = "0.4"
gelo-embedder = { path = "../gelo-embedder" }
gelo-tee-sev-snp = { path = "../gelo-tee-sev-snp", features = ["mock"] }
rag_core = { path = "../core", package = "core" }
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
hf-hub.workspace = true
serde_json.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# libc only used by the M1.12 R1 microbench to call `malloc_trim(0)`
# so the RSS measurement reflects kernel-visible free space, not
# glibc's free-list residency.
libc = "0.2"

[[bench]]
name = "amulet_attention"
harness = false
